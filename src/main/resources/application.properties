spring.application.name=razvoj-softvera
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/razvoj_softvera?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


app.security.jwt-secret=${JWT_SECRET:dev-tajni-kljuc-za-studsluzba-samo-lokalno-0123456789}
app.security.jwt-trajanje=${JWT_TRAJANJE:8h}
app.security.cors-origins=${CORS_ORIGINS:*}
app.seed.lozinka=${SEED_LOZINKA:lozinka123}
app.storage.root=${STORAGE_ROOT:storage}
app.predaja.tolerancija=${PREDAJA_TOLERANCIJA:60s}

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=1000
spring.servlet.multipart.max-file-size=75MB
spring.servlet.multipart.max-request-size=75MB

springdoc.api-docs.version=openapi_3_0